<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Золотая медаль: победитель Чемпионата Республики Тыва по спортивному программированию, 2023 -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".35" stop-color="#e2b13c"/>
      <stop offset=".7" stop-color="#a8761c"/>
      <stop offset="1" stop-color="#f3cf6a"/>
    </linearGradient>
    <radialGradient id="face" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset=".55" stop-color="#e7b743"/>
      <stop offset="1" stop-color="#b9831f"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4f0e"/>
      <stop offset="1" stop-color="#5c3a08"/>
    </linearGradient>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#rim)"/>
  <circle cx="48" cy="48" r="39.5" fill="url(#face)"/>
  <circle cx="48" cy="48" r="39.5" fill="none" stroke="#9a6a17" stroke-opacity=".55" stroke-width="1"/>
  <circle cx="48" cy="48" r="35" fill="none" stroke="#fff3c4" stroke-opacity=".6" stroke-width=".8" stroke-dasharray="1.5 2.2"/>

  <!-- Лавровые ветви -->
  <g fill="#8a5c12" fill-opacity=".85">
    <g id="branch">
      <path d="M27 66 C21 58 20 46 25 35" fill="none" stroke="#8a5c12" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="22.5" cy="60" rx="2.2" ry="4.4" transform="rotate(-35 22.5 60)"/>
      <ellipse cx="20.5" cy="52" rx="2.2" ry="4.4" transform="rotate(-12 20.5 52)"/>
      <ellipse cx="20.8" cy="44" rx="2.2" ry="4.4" transform="rotate(10 20.8 44)"/>
      <ellipse cx="23" cy="37" rx="2" ry="4" transform="rotate(30 23 37)"/>
      <ellipse cx="27.5" cy="60.5" rx="1.9" ry="3.8" transform="rotate(-70 27.5 60.5)"/>
      <ellipse cx="25.5" cy="52.5" rx="1.9" ry="3.8" transform="rotate(-60 25.5 52.5)"/>
      <ellipse cx="25.5" cy="44.5" rx="1.8" ry="3.6" transform="rotate(-45 25.5 44.5)"/>
    </g>
    <use href="#branch" transform="translate(96 0) scale(-1 1)"/>
  </g>

  <!-- Код и место -->
  <text x="48" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="url(#ink)">&lt;/&gt;</text>
  <text x="48" y="63" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="url(#ink)">1</text>
  <text x="48" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="6.2" font-weight="700" letter-spacing=".6" fill="url(#ink)">ТЫВА 2023</text>

  <!-- Блик -->
  <path d="M18 34 A33 33 0 0 1 58 13" fill="none" stroke="#fffbe6" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"/>
</svg>
