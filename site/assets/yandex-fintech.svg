<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Значок «Стажер Яндекс Финтеха», 2024: голографическая «Я» -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d4ff"/>
      <stop offset=".35" stop-color="#8f86d9"/>
      <stop offset=".65" stop-color="#6f8fd0"/>
      <stop offset="1" stop-color="#f0b6d6"/>
    </linearGradient>
    <linearGradient id="face" x1=".1" y1=".1" x2=".9" y2=".95">
      <stop offset="0" stop-color="#cfd8ff"/>
      <stop offset=".3" stop-color="#b9b0f2"/>
      <stop offset=".5" stop-color="#a9e4ec"/>
      <stop offset=".72" stop-color="#c7b8f4"/>
      <stop offset="1" stop-color="#f4b3cf"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.6" flood-color="#3d2f8f" flood-opacity=".55"/>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#rim)"/>
  <circle cx="48" cy="48" r="39.5" fill="url(#face)"/>
  <circle cx="48" cy="48" r="39.5" fill="url(#sheen)"/>
  <circle cx="48" cy="48" r="39.5" fill="none" stroke="#5a4fb0" stroke-opacity=".35" stroke-width="1"/>

  <!-- Буква «Я» – белая, с тенью, чтобы читалась на светлом фоне -->
  <path transform="translate(2 0)" filter="url(#lift)" fill="#fff" fill-rule="evenodd"
        stroke="#4a3fa0" stroke-opacity=".25" stroke-width=".6"
        d="M59 26 V70 H52.6 V52.4 H47.6 L39.8 70 H32.8 L41.4 51.2 C36.6 49.6 33.8 45.6 33.8 39.4 C33.8 31 39.4 26 48 26 Z
           M52.6 31.6 H48.4 C43.2 31.6 40.4 34.4 40.4 39.2 C40.4 44 43.2 46.8 48.4 46.8 H52.6 Z"/>

  <!-- Блик -->
  <path d="M18 34 A33 33 0 0 1 58 13" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>
</svg>
