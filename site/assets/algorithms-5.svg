  <text x="48" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7" font-weight="700" fill="#fff" fill-opacity=".85">39/40</text>

  <path d="M18 34 A33 33 0 0 1 58 13" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"/>
