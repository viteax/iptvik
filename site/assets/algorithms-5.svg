<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Значок «Тренировки по алгоритмам 5.0», 2024: топ-200, 39 из 40 задач -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset=".5" stop-color="#2a2a6e"/>
      <stop offset="1" stop-color="#7c7cf0"/>
    </linearGradient>
    <radialGradient id="face" cx=".4" cy=".3" r=".85">
      <stop offset="0" stop-color="#1c1c3a"/>
      <stop offset="1" stop-color="#08081a"/>
